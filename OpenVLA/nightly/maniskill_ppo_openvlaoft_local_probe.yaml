defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_ood_template@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: /share/yangpengju-local/openvla-oft-repro/runs/post_training_20260923/rl_openvlaoft_maniskill
    project_name: rlinf
    experiment_name: openvlaoft_ppo_object_probe
    logger_backends: []
  max_epochs: 1000
  max_steps: 2
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: true
    use_fixed_reset_state_ids: false
    max_episode_steps: 8
    max_steps_per_rollout_epoch: 8
    enable_offload: true
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 8
    max_steps_per_rollout_epoch: 8
    use_fixed_reset_state_ids: true
    group_size: 1
    enable_offload: true
    video_cfg:
      save_video: false

rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: /share/yangpengju-local/openvla-oft-repro/checkpoints/openvla-7b-oft-finetuned-libero-spatial
    precision: ${actor.model.precision}
    attn_implementation: eager

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 2
  seed: 1234
  enable_offload: true
  model:
    model_path: /share/yangpengju-local/openvla-oft-repro/checkpoints/openvla-7b-oft-finetuned-libero-spatial
    model_type: openvla_oft
    implement_version: official
    attn_implementation: eager
    unnorm_key: libero_spatial_no_noops
    policy_setup: widowx_bridge
    use_proprio: true
    use_film: false
    num_images_in_input: 2
    is_lora: false
    add_value_head: true
    max_prompt_length: 50
  optim:
    lr: 1e-5
    value_lr: 3e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
